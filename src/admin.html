<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumday · Private Inbox</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#f6f3ed;color:#25231f}body{max-width:1200px;margin:auto;padding:24px}header,nav,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:24px}h2{font-size:20px;white-space:pre-wrap;overflow-wrap:anywhere}button,textarea,select{font:inherit}select{padding:8px;border:1px solid #aaa;border-radius:8px;background:transparent;color:inherit;max-width:100%}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}.filters label{display:grid;gap:4px;font-size:14px}#appID{font-size:12px;overflow-wrap:anywhere}button{padding:10px 16px;border:1px solid #aaa;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#e5ddcf}button:disabled{opacity:.5;cursor:wait}textarea{box-sizing:border-box;width:100%;min-height:100px;background:transparent;color:inherit;padding:12px;border-radius:8px;margin:8px 0}article{padding:16px 0;border-bottom:1px solid #bbb;overflow-wrap:anywhere}article button{width:100%;text-align:left;white-space:pre-wrap}article p{margin:8px 0;white-space:pre-wrap}small,#metadata{color:#69645e}.message{padding:16px;border-radius:12px;background:#fffaf2;margin:12px 0}.message.operator{border-left:3px solid #857257}.message p{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer;font-size:14px}dl{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:14px}dd{margin:0;overflow-wrap:anywhere}#error{color:#a53328;white-space:pre-wrap}#error:empty{display:none}#notice{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:32px;margin-top:20px}#messages{max-height:52vh;overflow:auto}#conversation{min-width:0}#reply{margin-top:16px}#pendingHelp{font-size:14px}[hidden]{display:none!important}@media(max-width:680px){body{padding:16px}main{display:block}#conversation{margin-top:24px}#messages{max-height:50vh}}@media(prefers-color-scheme:dark){:root{background:#25231f;color:#f6f3ed}.message{background:#35322c}small,#metadata{color:#bbb5ad}button[aria-pressed=true]{background:#494237}}
</style>
<header><div><h1 id="appName">Private Inbox</h1><small id="appID"></small></div><button id="refresh">새로고침</button></header>
<nav aria-label="문의 보기"><button data-filter="open">열린 문의</button><button data-filter="waiting">답변 대기</button><button data-filter="closed">종료</button></nav>
<div class="filters" aria-label="문의 환경 필터"><label for="release">앱 버전·빌드<select id="release"><option value="">모든 버전</option></select></label><label for="system">OS<select id="system"><option value="">모든 OS</option></select></label><button id="clearFilters">필터 초기화</button></div>
<p id="error" role="alert"></p><p id="notice" role="status"></p>
<main><aside><section id="list" aria-label="문의 목록"></section><button id="more" hidden>문의 더 보기</button></aside>
<p id="placeholder">문의가 도착하면 원문을 읽고 여기서 답변할 수 있습니다.</p>
<section id="conversation" hidden><button id="back">대화 닫기</button><h2 id="title"></h2><p id="metadata"></p>
<details id="ai" hidden><summary>AI 참고</summary><p id="aiText"></p><small>원문을 확인해 판단하세요. AI는 문의를 숨기거나 종료하지 않습니다.</small></details>
<button id="older" hidden>이전 대화 보기</button><div id="messages" aria-label="대화 내용"></div>
<form id="reply"><label for="body">답변</label><textarea id="body" required></textarea>
<p id="pendingHelp" hidden>전송 결과가 확인될 때까지 내용을 보관합니다. 같은 답변으로 다시 확인하세요.</p>
<div class="actions"><button id="send" type="submit">답변 보내기</button><button id="close" type="button">문의 종료</button></div></form>
<details><summary>설치 관리</summary><button id="block" type="button">이 설치 차단</button></details>
</section></main><script src="/admin/app.js" defer></script></html>
